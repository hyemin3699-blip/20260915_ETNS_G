<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · ETNS 할일관리</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container auth-container">
    <h1>📋 ETNS 할일관리</h1>
    <p class="auth-sub">로그인하고 나만의 할일을 관리하세요</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class="flash-list">
            {% for message in messages %}
            <li class="flash-item">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="post" class="auth-form">
        <input type="text" name="username" placeholder="아이디" autofocus required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
</div>
</body>
</html>
